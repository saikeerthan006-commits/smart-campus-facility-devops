name: Smart Campus CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-security:
    name: "Stage 1: Automated Tests, Security & Migration Gate"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus_admin
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: smart_campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_admin -d smart_campus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Versioned Source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Code Linting (Ruff)
        run: ruff check app campus_model.py tests migrations scripts loadtest

      - name: Secret Pattern Scan (Verify Zero Hardcoded Secrets)
        run: python scripts/secret_scan.py

      - name: Day-4 Expand-and-Contract Migration & Failure Restore Gate
        run: |
          python migrations/002_campus_policies_and_outbox.py --seed-legacy --rehearse-failure

      - name: SAST Security Scan (Bandit)
        run: |
          bandit -r app campus_model.py -ll -f txt -o bandit-report.txt
          cat bandit-report.txt

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc on || true

      - name: Execute Unit, Integration, Security & Day-4 Regression Suite
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          python -m pytest tests -v -W ignore --cov=app --cov=campus_model --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Publish JUnit Test & Security Artifacts (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-security-reports-${{ github.sha }}
          path: |
            test-results.xml
            coverage.xml
            bandit-report.txt

  build-deploy-smoke:
    name: "Stage 2: Docker Build, Trivy Scan & Isolated Smoke Gate"
    needs: test-and-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Versioned Source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 for Smoke & Recovery Verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Verification Dependencies
        run: pip install -r requirements.txt

      - name: Build Production Multi-Stage Docker Image
        run: |
          sed -i 's/\r$//' scripts/smoke-test.sh
          docker build -t campus-backend:${{ github.sha }} -t campus-backend:latest .
          IMAGE_ID=$(docker inspect --format='{{.Id}}' campus-backend:${{ github.sha }})
          echo "Built Docker Image Tag: campus-backend:${{ github.sha }}"
          echo "Docker Image SHA256 Digest: ${IMAGE_ID}"

      - name: Container Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "campus-backend:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Deploy Isolated Stack via Docker Compose & Run Post-Deploy Smoke Check
        env:
          CAMPUS_IMAGE: campus-backend:${{ github.sha }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          docker compose up -d
          docker compose ps
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh http://127.0.0.1:8000

      - name: Rehearse Release Failure Detection & Rollback Recovery
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          python scripts/recovery_rehearsal.py

      - name: Tear Down Isolated Environment
        if: always()
        run: |
          docker compose logs campus-api || true
          docker compose down -v
